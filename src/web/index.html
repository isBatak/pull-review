<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>pull-review</title>
    <script>
      try {
        const mode = JSON.parse(localStorage.getItem('pull-review:theme') ?? 'null')
        const name = JSON.parse(localStorage.getItem('pull-review:theme-name') ?? '"classic"')
        const dark = name !== 'classic' || (mode ? mode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        if (name !== 'classic')
          document.documentElement.dataset.pandaTheme = name
        document.documentElement.dataset.tavernFaction = JSON.parse(localStorage.getItem('pull-review:tavern-faction') ?? '"default"')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
