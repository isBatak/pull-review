name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Check if this version is released
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version is already released. Bump the version to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.version.outputs.skip != 'true'
        with:
          version: 11

      - uses: actions/setup-node@v7
        if: steps.version.outputs.skip != 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Read pinned tinyjs
        id: tinyjs
        if: steps.version.outputs.skip != 'true'
        run: |
          echo "version=$(node -p "require('./package.json').pinned.tinyjs")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(node -p "require('./package.json').pinned.tinyjsMacosArm64Sha256")" >> "$GITHUB_OUTPUT"

      - name: Cache tinyjs download
        if: steps.version.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: ~/tinyjs-download
          key: tinyjs-macos-arm64-${{ steps.tinyjs.outputs.version }}-${{ steps.tinyjs.outputs.sha256 }}

      - name: Install tinyjs
        if: steps.version.outputs.skip != 'true'
        env:
          TINYJS_VERSION: ${{ steps.tinyjs.outputs.version }}
          TINYJS_SHA256: ${{ steps.tinyjs.outputs.sha256 }}
        run: |
          archive="$HOME/tinyjs-download/tinyjs-macos-arm64.tar.gz"
          if [ ! -f "$archive" ]; then
            mkdir -p "$(dirname "$archive")"
            curl -fsSL --retry 5 --retry-all-errors -o "$archive" \
              "https://github.com/tarwin/tinyjsapp/releases/download/v$TINYJS_VERSION/tinyjs-macos-arm64.tar.gz"
          fi
          echo "$TINYJS_SHA256  $archive" | shasum -a 256 -c -
          mkdir -p "$HOME/.tinyjs"
          tar -xzf "$archive" -C "$HOME/.tinyjs" --strip-components 1
          echo "$HOME/.tinyjs" >> "$GITHUB_PATH"

      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Check
        if: steps.version.outputs.skip != 'true'
        run: |
          pnpm typecheck
          pnpm test

      - name: Release v${{ steps.version.outputs.version }}
        if: steps.version.outputs.skip != 'true'
        run: pnpm release --ci
